[project]
name = "learnpython-api"
version = "0.1.0"
description = "Backend for the LearnPython platform: auth, curriculum delivery, progress. Never executes learner code."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
]
# The libraries Track B's content runs on, for verifying it under CPython
# (apps/api/tests/test_authored_content_packages.py and friends). Not a runtime
# dependency of the API — it never executes learner code — so kept out of the
# production install. Pinned to the versions inside Pyodide 314.0.6 wherever
# PyPI has them for this Python; scipy 1.18.0 needs Python 3.12, so scipy is one
# minor behind. See docs/spike-scientific-stack.md §4.
content = [
    "numpy==2.4.6",
    "pandas==3.0.2",
    "scipy>=1.17,<1.19",
    "matplotlib==3.10.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI's Depends() in defaults is the framework's idiom.
    "RUF012", # Mutable class attrs are fine on SQLAlchemy/Pydantic models.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
exclude = ["^tests/"]
