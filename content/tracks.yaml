tracks:
  - slug: track-a
    position: 1
    title: Python Fundamentals
    summary_markdown: >-
      Start from nothing and finish able to write a real program: variables and
      types, decisions, loops, collections, functions, error handling, and
      files. No prior programming experience assumed, and nothing to install.

  - slug: track-b
    position: 2
    title: Applied Statistics for Biological Data
    prerequisite_slug: track-a
    summary_markdown: >-
      Use the Python you have learned to analyse a table of biological
      measurements: loading and cleaning it, computing statistics by hand and
      then with pandas and scipy, comparing two conditions across hundreds of
      features at once, correcting for doing so, and drawing and reading a
      volcano plot. It ends with a complete analysis you assemble yourself. No
      biology background assumed — the four words you need are introduced where
      you need them.
