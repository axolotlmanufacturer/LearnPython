slug: predict-range
lesson: for-loops
position: 1
title: Predict how many lines
bloom: understand
scaffold_level: predict
prompt_markdown: |
  Before running: how many lines will this print in total, and what is the last
  number shown?

  Write both answers down. The two `range` calls do not produce the same numbers,
  and the difference is the thing this lesson most wants you to notice.
starter_code: |
  for n in range(3):
      print("A", n)

  for n in range(1, 3):
      print("B", n)
checks:
  - kind: stdout
    label: The program runs unchanged
    expected: |
      A 0
      A 1
      A 2
      B 1
      B 2
hints:
  - "`range(3)` starts at 0 and stops *before* 3."
  - "`range(1, 3)` starts at 1 and still stops before 3 — so it produces two numbers, not three."
solution_code: |
  for n in range(3):
      print("A", n)

  for n in range(1, 3):
      print("B", n)
