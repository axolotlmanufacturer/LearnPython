slug: password-check
lesson: if-statements
position: 3
title: Check a password and respond
bloom: create
scaffold_level: write_from_spec
prompt_markdown: |
  Write this from scratch, pulling together this module and Module 2.

  Ask for a password with the prompt `Password: `, then judge it:

  - shorter than 8 characters → print `Too short.`
  - 8 or more, but no digit in it → print `Add a number.`
  - otherwise → print `Looks good.`

  The answer typed will be `hunter2two`, so the output should be:

  ```
  Password: Looks good.
  ```

  To find out whether a string contains a digit, there is a method for exactly
  that: `any(c.isdigit() for c in text)` works, but so does the simpler loop you
  will meet in Module 4. For now, `text.isalpha()` is `True` when a string is
  *only* letters — which is the same question asked the other way round.
starter_code: |
  # Ask for the password, then print one of the three messages.
stdin:
  - hunter2two
checks:
  - kind: stdout
    label: A long password containing a digit is accepted
    expected: "Password: Looks good."
  - kind: source
    label: The decision is made with if
    require_ast:
      - If
hints:
  - '`password = input("Password: ")` gives you the text to judge.'
  - "Check the length first: `if len(password) < 8:`."
  - "`password.isalpha()` is True when there are no digits in it at all, which is the second branch."
solution_code: |
  password = input("Password: ")

  if len(password) < 8:
      print("Too short.")
  elif password.isalpha():
      print("Add a number.")
  else:
      print("Looks good.")
