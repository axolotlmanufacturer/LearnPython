prompt_markdown: |
  `mean` and `sample_variance` are written for you. Write a function
  `sample_stdev(values)` that returns the sample standard deviation, built on
  `sample_variance`.

  Then write a second function, `summarise(values)`, that returns a pair: the mean
  and the sample standard deviation, each **rounded to two decimal places**.

  Finally, check yourself: Python's own `statistics.stdev` computes the same thing.
  Print both for `gene_004`'s six control values and confirm they agree — that
  comparison is the habit this module is trying to build.
starter_code: |
  import statistics


  def mean(values):
      return sum(values) / len(values)


  def sample_variance(values):
      centre = mean(values)
      return sum((value - centre) ** 2 for value in values) / (len(values) - 1)


  control = [10.02, 9.41, 9.98, 9.76, 10.01, 9.17]

  # Your code here.
