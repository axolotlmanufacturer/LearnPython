hints:
  - The standard deviation is the square root of the variance — `** 0.5`.
  - "`summarise` can call your other two functions and return `(a, b)`."
  - "`return round(mean(values), 2), round(sample_stdev(values), 2)`"
solution_code: |
  import statistics


  def mean(values):
      return sum(values) / len(values)


  def sample_variance(values):
      centre = mean(values)
      return sum((value - centre) ** 2 for value in values) / (len(values) - 1)


  def sample_stdev(values):
      return sample_variance(values) ** 0.5


  def summarise(values):
      return round(mean(values), 2), round(sample_stdev(values), 2)


  control = [10.02, 9.41, 9.98, 9.76, 10.01, 9.17]

  print(sample_stdev(control))
  print(statistics.stdev(control))
  print(summarise(control))
