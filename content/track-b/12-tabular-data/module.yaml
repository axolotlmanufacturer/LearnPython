title: Loading and Inspecting a Table
summary_markdown: >-
  Getting the measurements into Python and looking at them honestly. First by
  hand, with nothing but open() and split() — so that when pandas does it in one
  line, you know what that line is doing. Then pandas itself, and the gaps in
  the data that every real measurement has.

