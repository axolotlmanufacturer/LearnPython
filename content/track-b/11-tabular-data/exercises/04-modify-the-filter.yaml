slug: modify-the-filter
lesson: selecting-and-cleaning
position: 1
title: Change what the filter selects
bloom: apply
scaffold_level: modify
packages: [pandas]
prompt_markdown: |
  This program counts the northern samples. Change it so it instead counts the
  samples that are **southern and warmer than 18 degrees**.

  Remember that combining two conditions needs `&`, and that each condition needs
  its own brackets.
starter_code: |
  import pandas as pd

  readings = pd.read_csv("readings.csv")

  selected = readings[readings["site"] == "north"]

  print(len(selected))
files:
  readings.csv: |
    sample_id,site,temperature_c,count
    S001,north,12.4,31
    S002,north,13.1,28
    S003,south,18.9,44
    S004,south,19.2,51
    S005,north,11.8,25
    S006,south,17.7,39
    S007,south,21.0,60
    S008,north,10.2,20
checks:
  - kind: stdout
    label: Counts the 3 southern samples above 18 degrees
    expected: "3"
hints:
  - Two conditions joined with `&`, each in its own brackets.
  - '`(readings["site"] == "south") & (readings["temperature_c"] > 18)`'
solution_code: |
  import pandas as pd

  readings = pd.read_csv("readings.csv")

  selected = readings[(readings["site"] == "south") & (readings["temperature_c"] > 18)]

  print(len(selected))
