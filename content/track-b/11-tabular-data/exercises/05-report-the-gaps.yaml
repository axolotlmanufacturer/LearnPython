slug: report-the-gaps
lesson: selecting-and-cleaning
position: 2
title: Say what you dropped
bloom: apply
scaffold_level: write_from_spec
packages: [pandas]
prompt_markdown: |
  `readings.csv` has some rows with no temperature recorded.

  Write a program that:

  1. Loads the file.
  2. Prints `Dropped N rows with no temperature.` where `N` is how many rows are
     missing a value in `temperature_c`.
  3. Prints `Mean of the rest: X` where `X` is the mean temperature of the
     remaining rows, rounded to one decimal place.

  Dropping rows silently is how an analysis stops being checkable. Counting them
  out loud is the whole point of this exercise.
starter_code: |
  import pandas as pd

  readings = pd.read_csv("readings.csv")

  # Your code here.
files:
  readings.csv: |
    sample_id,site,temperature_c
    S001,north,12.4
    S002,north,
    S003,south,18.9
    S004,south,19.2
    S005,north,
    S006,south,17.5
checks:
  - kind: stdout
    label: Reports 2 dropped rows and a mean of 17.0
    expected: |
      Dropped 2 rows with no temperature.
      Mean of the rest: 17.0
hints:
  - '`readings["temperature_c"].isna()` gives a True/False column.'
  - "`.sum()` on that column counts the Trues, because True counts as 1."
  - '`readings.dropna(subset=["temperature_c"])` gives you the rows that are left.'
  - 'The mean of the remaining temperatures is `usable["temperature_c"].mean()`.'
solution_code: |
  import pandas as pd

  readings = pd.read_csv("readings.csv")

  missing = readings["temperature_c"].isna().sum()
  usable = readings.dropna(subset=["temperature_c"])

  print(f"Dropped {missing} rows with no temperature.")
  print(f"Mean of the rest: {round(usable['temperature_c'].mean(), 1)}")
