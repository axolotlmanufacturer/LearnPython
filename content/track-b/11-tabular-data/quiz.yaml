items:
  - slug: dataframe-vs-list
    position: 1
    kind: multiple_choice
    prompt_markdown: |
      What does a DataFrame column give you that a list of lists does not?
    options:
      - A column has one type throughout, so data that does not fit is visible
      - It can hold more values
      - It is stored on disk rather than in memory
      - It sorts itself automatically
    answer: A column has one type throughout, so data that does not fit is visible
    explanation_markdown: >-
      A list happily holds a number in one row and a string in the next. A
      DataFrame column has a type, so a numeric column that arrived as text —
      usually because one cell said `n/a` — shows up as a problem instead of
      quietly breaking every calculation downstream.

  - slug: recall-keyerror
    position: 2
    kind: multiple_choice
    reviews_module_slug: collections
    prompt_markdown: |
      From Module 5 — `readings["temperature"]` raises `KeyError: 'temperature'`.
      What does that tell you?
    options:
      - There is no column with exactly that name
      - The column is empty
      - The file failed to load
      - The values are the wrong type
    answer: There is no column with exactly that name
    explanation_markdown: >-
      Exactly the same error a dictionary raises for a missing key, and for the
      same reason. Print `list(readings.columns)` and compare character by
      character — a trailing space or a missing unit suffix is the usual cause.

  - slug: filling-gaps-with-zero
    position: 3
    kind: multiple_choice
    prompt_markdown: |
      A temperature column has gaps. Someone fills them with
      `fillna(0)`. What is wrong with that?
    options:
      - Zero is a real temperature, so every later average is wrong and nothing warns you
      - "`fillna` does not work on numbers"
      - It deletes the rest of the column
      - Nothing — it is the standard fix
    answer: Zero is a real temperature, so every later average is wrong and nothing warns you
    explanation_markdown: >-
      Filling means "this value is 0", not "this value is unknown". For a count
      of sightings 0 might genuinely be right; for a temperature it is a
      measurement you never made. Dropping with a stated count is usually the
      honest choice.

  - slug: recall-boolean-and
    position: 4
    kind: predict_output
    reviews_module_slug: conditionals
    prompt_markdown: What does this print?
    code: |
      import pandas as pd

      df = pd.DataFrame({"n": [1, 2, 3, 4]})
      print(len(df[(df["n"] > 1) & (df["n"] < 4)]))
    options:
      - "`2`"
      - "`3`"
      - "`4`"
      - It raises an error
    answer: "`2`"
    explanation_markdown: >-
      Two conditions, both must hold: 2 and 3 qualify, 1 and 4 do not. Note the
      brackets around each half — without them Python groups the expression
      wrongly and the error it gives does not obviously say so.
