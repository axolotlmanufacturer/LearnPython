hints:
  - The first group has as many values as `before` did.
  - You are comparing each shuffled difference against the real one.
  - A proportion is the count divided by how many trials you ran.
solution_code: |
  import random

  before = [12, 15, 11, 14, 13]
  after = [18, 16, 19, 17, 20]

  def mean(values):
      return sum(values) / len(values)

  observed = mean(after) - mean(before)
  everything = before + after

  random.seed(7)
  at_least_as_big = 0
  trials = 2000

  for _ in range(trials):
      random.shuffle(everything)
      difference = mean(everything[5:]) - mean(everything[:5])
      if abs(difference) >= abs(observed):
          at_least_as_big += 1

  print("observed:", observed)
  print("p:", at_least_as_big / trials)
