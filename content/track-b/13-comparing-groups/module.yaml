slug: comparing-groups
track: track-b
position: 13
title: Is That Difference Real?
summary_markdown: >-
  Two groups have different means. This module is about the only question that
  matters next: could a difference that size have happened by chance alone? You
  will build the answer yourself by shuffling the data, then meet the t-test that
  does the same job with a formula — and, more importantly, learn what a p-value
  does not mean.

objectives:
  - text: State what a p-value is and what it is not
    bloom: understand
  - text: Estimate a p-value by randomly reshuffling group labels
    bloom: apply
  - text: Run a two-sample t-test with scipy and read its output
    bloom: apply
  - text: Explain why a small p-value with a tiny effect can be uninteresting
    bloom: analyze
  - text: Decide whether a reported comparison supports the claim made from it
    bloom: evaluate
