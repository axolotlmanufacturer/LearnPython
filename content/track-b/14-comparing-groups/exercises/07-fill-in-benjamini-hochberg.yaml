prompt_markdown: |
  This function works through the p-values from the **largest rank down to the
  smallest**, which is what lets it carry the running minimum of step 3 along
  with it.

  Fill in the two blanks: what the p-value at rank `rank` is multiplied by, and
  what gets stored as its adjusted value.

  The second check uses p-values chosen so that step 3 matters. If it fails and
  the first passes, look at what you are storing.
starter_code: |
  def benjamini_hochberg(pvalues):
      n = len(pvalues)
      # Positions of the p-values, smallest p first. order[0] is rank 1.
      order = sorted(range(n), key=lambda i: pvalues[i])

      adjusted = [0.0] * n
      running_min = 1.0
      for rank in range(n, 0, -1):
          i = order[rank - 1]
          scaled = pvalues[i] * SCALE_FACTOR
          running_min = min(running_min, scaled)
          adjusted[i] = STORED_VALUE
      return adjusted


  print(benjamini_hochberg([0.01, 0.05, 0.3, 0.03]))
