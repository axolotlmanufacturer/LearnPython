hints:
  - Step 2 of the lesson multiplies the p-value at rank k by n / k.
  - The adjusted value is the smallest scaled value seen so far, from the top rank down.
  - "`n / rank` and `running_min`"
solution_code: |
  def benjamini_hochberg(pvalues):
      n = len(pvalues)
      # Positions of the p-values, smallest p first. order[0] is rank 1.
      order = sorted(range(n), key=lambda i: pvalues[i])

      adjusted = [0.0] * n
      running_min = 1.0
      for rank in range(n, 0, -1):
          i = order[rank - 1]
          scaled = pvalues[i] * n / rank
          running_min = min(running_min, scaled)
          adjusted[i] = running_min
      return adjusted


  print(benjamini_hochberg([0.01, 0.05, 0.3, 0.03]))
