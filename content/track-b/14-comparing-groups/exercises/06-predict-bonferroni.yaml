slug: predict-bonferroni
lesson: many-tests-at-once
position: 1
title: Predict what Bonferroni keeps
bloom: understand
scaffold_level: predict
prompt_markdown: |
  Four features, four p-values. Bonferroni multiplies each by the number of
  tests and caps the result at 1.

  Predict both printed lines before you run it. Three of the four raw p-values
  are at or below 0.05 — how many survive?
starter_code: |
  pvalues = [0.01, 0.05, 0.3, 0.03]
  n = len(pvalues)

  adjusted = [min(p * n, 1.0) for p in pvalues]

  print(adjusted)
  print([a < 0.05 for a in adjusted])
checks:
  - kind: stdout
    label: The program runs unchanged
    expected: |
      [0.04, 0.2, 1.0, 0.12]
      [True, False, False, False]
solution_code: |
  pvalues = [0.01, 0.05, 0.3, 0.03]
  n = len(pvalues)

  adjusted = [min(p * n, 1.0) for p in pvalues]

  print(adjusted)
  print([a < 0.05 for a in adjusted])
