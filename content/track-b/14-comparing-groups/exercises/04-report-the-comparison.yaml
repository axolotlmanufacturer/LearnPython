prompt_markdown: |
  The data is loaded, filtered and normalised exactly as in Module 13. Compare
  `gene_034` between the conditions with Welch's t-test, and print exactly two
  lines:

  ```
  gene_034: treated - control = 0.66
  p = 0.0302
  ```

  The difference to two decimal places, the p-value to four. (The lesson's
  worked example printed 0.0301 because its lists were rounded to two decimals
  for display; here you are using the full values.)

  Note what is being asked for: the effect **and** the p-value. "The difference
  was significant" is not a reportable result.
