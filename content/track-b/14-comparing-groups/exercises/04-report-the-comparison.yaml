hints:
  - Find the control and treated sample names from the sample table, as in Module 13.
  - '`normalised.loc["gene_034", treated]` is that feature''s six treated values.'
  - '`stats.ttest_ind(a, b, equal_var=False).pvalue`, formatted with `f"{p:.4f}"`.'
solution_code: |
  import pandas as pd
  from scipy import stats

  expression = pd.read_csv("expression.csv", index_col="feature")
  samples = pd.read_csv("samples.csv")

  kept = expression[expression.mean(axis=1) >= 6.0]
  normalised = kept - kept.median()

  control = samples.loc[samples["condition"] == "control", "sample_id"]
  treated = samples.loc[samples["condition"] == "treated", "sample_id"]

  treated_values = normalised.loc["gene_034", treated]
  control_values = normalised.loc["gene_034", control]

  difference = treated_values.mean() - control_values.mean()
  result = stats.ttest_ind(treated_values, control_values, equal_var=False)

  print(f"gene_034: treated - control = {difference:.2f}")
  print(f"p = {result.pvalue:.4f}")
