slug: judge-the-claim
lesson: the-t-test
position: 3
title: Judge whether the claim survives the numbers
bloom: evaluate
scaffold_level: write_from_spec
packages: [pandas, scipy]
prompt_markdown: |
  A colleague reports: *"Our supplement significantly increases growth."*

  Their data is in `growth.csv`. It is a large study — 400 plants — and their
  p-value really is small.

  Write a program printing exactly three lines:

  ```
  difference = 0.21 cm
  p = 0.0004
  claim holds: False
  ```

  Print `claim holds: True` only if the difference is **at least 1 cm** as well
  as having p below 0.05. A fifth of a millimetre of extra growth is not what
  anyone means by "increases growth", however small the p-value gets — and with
  400 plants, almost any difference will clear a significance threshold.

  This is the exercise where the two numbers come apart. Which one answers the
  colleague's claim?
starter_code: |
  import pandas as pd
  from scipy import stats

  growth = pd.read_csv("growth.csv")

  # Your code here.
