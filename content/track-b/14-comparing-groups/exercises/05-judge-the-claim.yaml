hints:
  - Split the two groups the same way as the previous exercise.
  - "The threshold is two conditions joined with `and`."
  - "A comparison such as `difference >= 1` already gives you True or False — no `if` needed."
solution_code: |
  import pandas as pd
  from scipy import stats

  growth = pd.read_csv("growth.csv")

  supplement = growth[growth["group"] == "supplement"]["height_cm"]
  plain = growth[growth["group"] == "plain"]["height_cm"]

  difference = supplement.mean() - plain.mean()
  result = stats.ttest_ind(supplement, plain, equal_var=False)

  print(f"difference = {difference:.2f} cm")
  print(f"p = {result.pvalue:.4f}")
  print("claim holds:", difference >= 1 and result.pvalue < 0.05)
