items:
  - slug: mean-and-median-apart
    position: 1
    kind: multiple_choice
    prompt_markdown: |
      A column's mean is 20 and its median is 3. What should you do?
    options:
      - Look at the largest values — something is pulling on the tail, and it is either an error or the interesting part
      - Report the mean, since it uses every value
      - Report the median, since it ignores outliers
      - Average the two
    answer: Look at the largest values — something is pulling on the tail, and it is either an error or the interesting part
    explanation_markdown: >-
      A large gap between mean and median is a signal, not a choice between two
      numbers. Either a value is wrong — a misplaced decimal point, a wrong unit
      — or it is real and is probably the most interesting thing in your data.
      Picking one statistic and moving on hides it either way.

  - slug: why-square-deviations
    position: 2
    kind: multiple_choice
    prompt_markdown: |
      In a standard deviation, why are the deviations squared before averaging?
    options:
      - Otherwise the ones above and below the mean cancel out to zero
      - To make the number larger
      - Because square roots are easier to compute
      - To remove missing values
    answer: Otherwise the ones above and below the mean cancel out to zero
    explanation_markdown: >-
      The deviations from the mean always sum to exactly zero — that is what the
      mean is. Squaring makes every deviation count as a distance. The square
      root at the end then undoes the squaring, so the answer is back in the
      original units rather than in squared ones.

  - slug: recall-list-comprehension
    position: 3
    kind: predict_output
    reviews_module_slug: collections
    prompt_markdown: What does this print?
    code: |
      values = [1, 2, 3]
      mean = sum(values) / len(values)
      print([round((v - mean) ** 2, 1) for v in values])
    options:
      - "`[1.0, 0.0, 1.0]`"
      - "`[-1.0, 0.0, 1.0]`"
      - "`[1, 4, 9]`"
      - "`[0.0, 1.0, 2.0]`"
    answer: "`[1.0, 0.0, 1.0]`"
    explanation_markdown: >-
      The mean is 2, so the deviations are -1, 0 and 1. Squaring makes the first
      positive, which is exactly the point — and note the deviations themselves
      sum to zero.

  - slug: count-alongside-mean
    position: 4
    kind: multiple_choice
    prompt_markdown: |
      Why ask `groupby` for `count` as well as `mean`?
    options:
      - A mean over 3 samples and a mean over 300 look identical but are not equally trustworthy
      - Otherwise the mean is computed wrongly
      - pandas requires it
      - It makes the table sort correctly
    answer: A mean over 3 samples and a mean over 300 look identical but are not equally trustworthy
    explanation_markdown: >-
      Nothing about the number 23.05 tells you how many measurements went into
      it. The count also catches missing values: if it is lower than the number
      of rows in that group, some values were dropped and you should know before
      drawing a conclusion.
