slug: describing-data
track: track-b
position: 12
title: Describing a Set of Numbers
summary_markdown: >-
  What a column of measurements is actually telling you. The middle, the spread,
  and why reporting one without the other is close to useless. You will compute
  each statistic by hand from the definition before using the built-in, because
  a function whose output you cannot sanity-check is a function that can be
  wrong without you noticing.

objectives:
  - text: Explain what the mean, median, standard deviation and quartiles each describe
    bloom: understand
  - text: Compute a mean and a standard deviation from their definitions
    bloom: apply
  - text: Summarise a column with pandas and read the result
    bloom: apply
  - text: Compare groups with groupby and interpret the table it produces
    bloom: apply
  - text: Judge when the mean misrepresents a distribution and say what to report instead
    bloom: evaluate
