name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

jobs:
  web:
    name: Web (lint, typecheck, unit + content tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Typecheck
        run: npm run typecheck --workspace=apps/web

      # Includes the execution-engine tests and the per-exercise content tests,
      # which run every authored reference solution against its own checks in a
      # real Pyodide interpreter. See docs/architecture.md §3.
      - name: Test
        run: npm run test --workspace=apps/web

      - name: Build
        run: npm run build --workspace=apps/web

  api:
    name: API (lint, typecheck, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learnpython_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Tests run against real PostgreSQL, not SQLite: the schema uses JSONB, and
      # a suite that exercises a different engine than production is testing
      # something other than the product.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/learnpython_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/learnpython_test

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Typecheck
        run: mypy app

      - name: Test
        run: pytest -q

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [web, api]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learnpython_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # playwright.config.ts starts both servers itself, applies migrations, and
      # loads content/ into this database before the suite runs.
      E2E_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/learnpython_e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: npm ci

      - name: Install API
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # Includes the accessibility audit (axe-core, WCAG 2.1 AA), the Core Web
      # Vitals budgets, and the security-header assertions. Those are documented
      # in docs/accessibility.md and docs/performance.md; running them here is
      # what keeps those documents true rather than aspirational.
      - name: Run end-to-end suite
        working-directory: apps/web
        run: npm run test:e2e
